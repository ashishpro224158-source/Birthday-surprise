
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surprise</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

/* Background photo */
.new-photo {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    filter: brightness(0);
    animation: brightnessOpen 5s ease-in-out forwards;
}

@keyframes brightnessOpen {
    from {
        filter: brightness(0);
    }
    to {
        filter: brightness(1);
    }
}

/* Flying photo */
.flying-photo {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 160px;
    height: auto;
    border: none;
    border-radius: 0;
    box-shadow: none;
    background: transparent;
    opacity: 0;

    animation:
        showPhoto 3s ease forwards,
        paperWave 4s ease-in-out 3s infinite;
}

@keyframes showPhoto {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

@keyframes paperWave {
    0% {
        transform: translate(-50%, -50%) rotate(-8deg);
    }

    25% {
        transform: translate(-50%, -65%) rotate(7deg);
    }

    50% {
        transform: translate(-50%, -50%) rotate(-5deg);
    }

    75% {
        transform: translate(-50%, -35%) rotate(8deg);
    }

    100% {
        transform: translate(-50%, -50%) rotate(-8deg);
    }
}
</style>
</head>

<body>

<img src="page2.jpg" class="new-photo">

<img src="floating.jpg" class="flying-photo">

</body>
</html>
