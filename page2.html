
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

.new-photo {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0);
    animation: brightnessOpen 5s ease forwards;
}

@keyframes brightnessOpen {
    to {
        filter: brightness(1);
    }
}

.flying-photo {
    position: fixed;
    top: -400px;
    left: 50%;
    width: 260px;
    height: auto;
    max-height: 75vh;
    object-fit: contain;

    border: none;
    border-radius: 0;
    box-shadow: none;
    outline: none;

    opacity: 0;
    transform: translateX(-50%);

    animation: fallDown 3.5s cubic-bezier(.22,.75,.35,1.2) 1s forwards;
}

@keyframes fallDown {
    0% {
        top: -400px;
        opacity: 0;
        transform: translateX(-50%) rotate(-15deg) scale(0.7);
    }

    55% {
        top: 52%;
        opacity: 1;
        transform: translateX(-50%) rotate(12deg) scale(1);
    }

    70% {
        top: 43%;
        transform: translateX(-50%) rotate(-8deg) scale(1.05);
    }

    85% {
        top: 51%;
        transform: translateX(-50%) rotate(4deg) scale(1.1);
    }

    100% {
        top: 50%;
        opacity: 1;
        transform: translate(-50%, -50%) rotate(0deg) scale(1.4);
    }
}
</style>
</head>

<body>

<img src="page2.jpg" class="new-photo">

<img src="floating.jpg" class="flying-photo">

</body>
</html>
